name: build-android

# 希尔娅 Android APK 远程编译工作流
# - push / tag / 手动触发 → ubuntu-latest 构建 release APK（R8 混淆 + 签名）
# - tag（v*）自动发布 GitHub Release 资产 + 生成 update-apk.json（供 APK 检查更新）

on:
  push:
    branches: [main, "GQY-windows"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 解析版本号
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version:' android/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "当前版本：$VERSION"

      - name: 依赖安装
        working-directory: android
        run: flutter pub get

      - name: 注入 release 签名（有 Secrets 时）
        shell: bash
        run: |
          if [ -n "${{ secrets.HILIA_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.HILIA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/hilia-keystore.jks"
            echo "HILIA_KEYSTORE_PATH=$RUNNER_TEMP/hilia-keystore.jks" >> "$GITHUB_ENV"
            echo "HILIA_KEYSTORE_PASS=${{ secrets.HILIA_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
            echo "HILIA_KEY_ALIAS=${{ secrets.HILIA_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "HILIA_KEY_PASS=${{ secrets.HILIA_KEY_PASS }}" >> "$GITHUB_ENV"
            echo "已注入 release 签名"
          else
            echo "未配置 keystore Secrets，使用 debug 签名构建"
          fi

      - name: 构建 release APK（R8 混淆 + Dart 混淆）
        working-directory: android
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=APP_VERSION=${{ env.version }}

      - name: 构建 update-signer（签名工具）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: 编译 update-signer
        working-directory: tools/update-signer
        run: cargo build --release

      - name: 计算校验与生成 update-apk.json
        shell: bash
        run: |
          APK="android/build/app/outputs/flutter-apk/app-release.apk"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          VERSION="${{ env.version }}"
          cat > update-apk.json <<EOF
          {
            "version": "$VERSION",
            "apk": {
              "version": "$VERSION",
              "urls": [
                "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Hilia-Android-$VERSION.apk",
                "https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v$VERSION/Hilia-Android-$VERSION.apk",
                "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/v$VERSION/Hilia-Android-$VERSION.apk",
                "https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/v$VERSION/Hilia-Android-$VERSION.apk"
              ],
              "sha256": "$SHA",
              "size": $SIZE
            },
            "notes": "希尔娅 Android 客户端 v$VERSION"
          }
          EOF
          # 签名（有私钥 Secrets 时；客户端拒绝未签名更新源）
          if [ -n "${{ secrets.HILIA_SIGN_KEY }}" ]; then
            ./tools/update-signer/target/release/update-signer sign update-apk.json "${{ secrets.HILIA_SIGN_KEY }}"
          else
            echo "⚠ 未配置 HILIA_SIGN_KEY，update-apk.json 未签名（客户端会拒绝）"
          fi
          mkdir -p android/dist
          cp "$APK" "android/dist/Hilia-Android-$VERSION.apk"
          cp update-apk.json android/dist/update-apk.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Hilia-Android
          path: |
            android/dist/Hilia-Android-${{ env.version }}.apk
            android/dist/update-apk.json
            android/build/symbols/
          if-no-files-found: error

      - name: 发布 GitHub Release 资产（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/Hilia-Android-${{ env.version }}.apk
            android/dist/update-apk.json
          body: |
            希尔娅 Android 客户端 v${{ github.ref_name }}

            - 安装：下载 APK 后允许「安装未知来源应用」即可
            - 首次使用：打开 App → 扫码 Windows 面板上的配对二维码
            - 开发者：2101497063@qq.com
