name: build-windows

# 希尔娅 Windows 版远程编译工作流
# - push / tag / 手动触发 → windows-latest 构建 hilia + hilia-tray
# - 打包 zip（exe + scripts + kb + memes + communication）
# - tag（v*）推送自动发布 GitHub Release

on:
  push:
    branches: [main, "GQY-windows"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            windows/tray

      - name: 构建核心 hilia.exe
        run: cargo build --release --locked

      - name: 构建托盘 hilia-tray.exe
        working-directory: windows/tray
        run: cargo build --release

      - name: 编译并运行核心单元测试（含签名验证，注入 HILIA_SIGN_KEY）
        env:
          HILIA_SIGN_KEY: ${{ secrets.HILIA_SIGN_KEY }}
        run: |
          cargo test --release --bin hilia --no-run
          cargo test --release --bin hilia -- --test-threads=1

      - name: 校验桥接脚本语法
        run: |
          node --check communication/lib/bridge-common.cjs
          node --check communication/napcat/bridge.cjs
          node --check communication/wecom/bridge.cjs
          node --check communication/feishu/bridge.cjs

      - name: 打包发行目录
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = "Hilia-$version-windows"
          Write-Host "==> 打包到 $PWD\$stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/hilia.exe $stage/ -Verbose
          Copy-Item windows/tray/target/release/hilia-tray.exe $stage/ -Verbose
          Copy-Item src/scripts $stage/scripts -Recurse
          Copy-Item kb $stage/kb -Recurse
          Copy-Item src/memes $stage/memes -Recurse
          Copy-Item communication $stage/communication -Recurse
          Remove-Item $stage/communication/feishu/node_modules -Recurse -Force -ErrorAction SilentlyContinue
          # 捆绑便携 Node.js（桥接脚本 runtime：中继/NapCat/企微/飞书，导员无需自行安装）
          $latestNode = (Invoke-RestMethod "https://nodejs.org/dist/index.json") |
            Where-Object { $_.version -like 'v20.*' } | Select-Object -First 1
          $nodeZipName = "node-$($latestNode.version)-win-x64.zip"
          $nodeZip = "$env:RUNNER_TEMP\$nodeZipName"
          Invoke-WebRequest "https://nodejs.org/dist/$($latestNode.version)/$nodeZipName" -OutFile $nodeZip
          Expand-Archive $nodeZip "$env:RUNNER_TEMP\node-extract" -Force
          New-Item -ItemType Directory -Force -Path "$stage\node" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\node-extract\node-v*-win-x64\node.exe" "$stage\node\node.exe"
          Copy-Item windows/install.ps1 $stage/install.ps1
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "stage_dir=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "stage_version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 生成签名 update.json（版本更新清单）
        shell: pwsh
        run: |
          $version = $env:stage_version
          $zip = "${{ env.stage_dir }}.zip"
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $size = (Get-Item $zip).Length
          $repo = "${{ github.repository }}"
          $urls = @(
            "https://github.com/$repo/releases/download/v$version/Hilia-$version-windows.zip",
            "https://ghproxy.net/https://github.com/$repo/releases/download/v$version/Hilia-$version-windows.zip",
            "https://gh-proxy.com/https://github.com/$repo/releases/download/v$version/Hilia-$version-windows.zip",
            "https://ghfast.top/https://github.com/$repo/releases/download/v$version/Hilia-$version-windows.zip"
          ) | ConvertTo-Json -Compress
          $notes = "希尔娅 v$version（Windows x86_64）"
          $json = @{
            version = $version
            min_version = "0.6.0"
            windows = @{
              version = $version
              urls = $urls
              sha256 = $sha
              size = $size
            }
            notes = $notes
          } | ConvertTo-Json -Depth 4
          Set-Content -Path update.json -Value $json -Encoding UTF8
          # 签名（有私钥 Secrets 时）
          if ("${{ secrets.HILIA_SIGN_KEY }}") {
            $env:HILIA_SIGN_KEY = "${{ secrets.HILIA_SIGN_KEY }}"
            & "${{ env.stage_dir }}/hilia.exe" keys sign-update update.json
          } else {
            Write-Host "⚠ 未配置 HILIA_SIGN_KEY，update.json 未签名"
          }
          Copy-Item update.json "${{ env.stage_dir }}/update.json"
          Copy-Item update.json "${{ env.stage_dir }}/update-windows.json"
          echo "update_json_ready=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 构建统一安装器（NSIS）
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco 安装后 PATH 不刷新，显式加入 NSIS 目录
          $env:Path += ";C:\Program Files (x86)\NSIS"
          makensis /DSTAGE_DIR="${{ env.stage_dir }}" /DAPP_VERSION=${{ env.stage_version }} windows/installer.nsi
          New-Item -ItemType Directory -Force -Path "${{ env.stage_dir }}/installer" | Out-Null
          Copy-Item "Hilia-Setup-${{ env.stage_version }}.exe" "${{ env.stage_dir }}/installer/" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Hilia-windows
          path: |
            ${{ env.stage_dir }}.zip
            ${{ env.stage_dir }}/hilia.exe
            ${{ env.stage_dir }}/hilia-tray.exe
            ${{ env.stage_dir }}/update.json
            ${{ env.stage_dir }}/installer/Hilia-Setup-${{ env.stage_version }}.exe
          if-no-files-found: error

      - name: 发布 GitHub Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.stage_dir }}/installer/Hilia-Setup-${{ env.stage_version }}.exe
            ${{ env.stage_dir }}.zip
            ${{ env.stage_dir }}/update.json
          body: |
            希尔娅 v${{ github.ref_name }}（Windows x86_64）

            ## 安装包（推荐）
            - `Hilia-Setup-${{ env.stage_version }}.exe`：统一安装主体 + 菜单栏（托盘）+ 开始菜单快捷方式 + 可选开机自启

            ## 便携版
            - `Hilia-${{ env.stage_version }}-windows.zip`：解压运行 `hilia-tray.exe`（或 `install.ps1`）

            ## 更新
            - `hilia update check` / `hilia update apply`（自动走多加速源）
            - 开发者：2101497063@qq.com
