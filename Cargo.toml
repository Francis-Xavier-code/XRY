[package]
name = "hilia"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Francis-Xavier-code/XRY"
description = "希尔娅 —— Windows AI 助理（班级学分管理 / 信息查询）"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1.5"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
local-ip-address = "0.6"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
crossterm = "0.28"
directories = "5.0"
hex = "0.4"
html2md = "0.2"
html2text = "0.12"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
json_comments = "0.2"
futures-util = "0.3"
flate2 = "1.0"
fuzzy-matcher = "0.3"
fancy-regex = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
if-addrs = "0.13"
libc = "0.2"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rand = "0.8"
rpassword = "7.4"
rodio = { version = "0.19", default-features = false, features = ["mp3", "wav"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
obfstr = "0.4"
pulldown-cmark = "0.13"
tempfile = "3.15"
tar = "0.4"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
trash = "5.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
zip = "2.2"
rust_xlsxwriter = "0.77"
urlencoding = "2.1"
vte = "0.15"
rustc-hash = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[build-dependencies]
base64 = "0.22"

[dev-dependencies]
tiktoken-rs = "0.12"
