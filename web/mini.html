<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>希尔娅 · 迷你对话</title>
<link rel="stylesheet" href="/mini.css">
</head>
<body>
  <div class="mini-shell">
    <!-- 回复区：发送后展开 -->
    <main class="mini-conversation" id="conversation" aria-live="polite" hidden>
      <div class="mini-scroll" id="scroll">
        <div class="mini-msgs" id="messages"></div>
        <!-- 思考中占位 -->
        <div class="mini-thinking" id="thinking" hidden>
          <div class="mini-avatar" id="miniAvatar">娅</div>
          <span class="thinking-dots"><i></i><i></i><i></i></span>
          <span class="thinking-label">希尔娅思考中…</span>
        </div>
      </div>
    </main>

    <!-- 输入条：常驻，圆角突出 -->
    <footer class="mini-inputbar">
      <form class="mini-form" id="form">
        <textarea class="mini-input" id="input" rows="1"
          placeholder="给希尔娅发消息…" aria-label="消息" autofocus></textarea>
        <button class="mini-send" id="send" type="submit" title="发送" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="mini-actions">
        <span class="mini-hint" id="hint">Enter 发送 · Shift+Enter 换行 · 开发者：2101497063@qq.com</span>
        <button class="mini-expand" id="expand" type="button" title="放大为面板" aria-label="放大为面板">⤢</button>
      </div>
    </footer>
  </div>
<script src="/mini.js"></script>
</body>
</html>
