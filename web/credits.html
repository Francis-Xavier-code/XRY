<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希尔娅 · 学分管理</title>
<link rel="stylesheet" href="/styles.css">
<style>
  /* ── 学分管理页专用样式 ── */
  .credits-shell { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .credits-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .credits-header h1 { font-size: 22px; margin: 0; }
  .credits-header .back-link { color: var(--accent, #6ea8fe); text-decoration: none; font-size: 14px; }
  .credits-header .dev { margin-left: auto; font-size: 12px; opacity: 0.55; }
  .credits-stats { display: flex; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-chip { background: var(--panel, rgba(255,255,255,0.04)); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 10px; padding: 10px 18px; font-size: 14px; }
  .stat-chip b { font-size: 18px; margin-right: 6px; }
  .credits-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  @media (max-width: 960px) { .credits-grid { grid-template-columns: 1fr; } }
  .cpanel { background: var(--panel, rgba(255,255,255,0.04)); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 14px; padding: 16px; }
  .cpanel h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .cpanel h2 .count { font-size: 12px; opacity: 0.6; }
  .class-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .class-item:hover { background: rgba(127,127,127,0.12); }
  .class-item.active { background: var(--accent, #6ea8fe); color: #fff; }
  .class-item .n { font-size: 12px; opacity: 0.7; }
  .type-item { padding: 6px 12px; font-size: 13px; opacity: 0.85; display: flex; justify-content: space-between; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { background: var(--input-bg, rgba(0,0,0,0.25)); border: 1px solid var(--border, rgba(255,255,255,0.12)); border-radius: 8px; padding: 8px 12px; color: inherit; font-size: 14px; }
  .toolbar input { min-width: 200px; }
  .cbtn { background: var(--accent, #6ea8fe); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  .cbtn.secondary { background: transparent; border: 1px solid var(--border, rgba(255,255,255,0.2)); color: inherit; }
  .cbtn.danger { background: #dc3545; }
  .cbtn:disabled { opacity: 0.5; cursor: not-allowed; }
  table.ctable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.ctable th, table.ctable td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border, rgba(255,255,255,0.07)); }
  table.ctable th { opacity: 0.6; font-weight: 500; font-size: 12.5px; }
  table.ctable tr:hover td { background: rgba(127,127,127,0.07); }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { background: none; border: none; color: var(--accent, #6ea8fe); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .row-actions button.danger { color: #e06070; }
  .points-pos { color: #6fce7f; }
  .points-neg { color: #e06070; }
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog { background: var(--bg, #14161c); border: 1px solid var(--border, rgba(255,255,255,0.12)); border-radius: 14px; padding: 22px; width: min(520px, 92vw); max-height: 88vh; overflow: auto; }
  .dialog h3 { margin: 0 0 16px; font-size: 17px; }
  .dialog .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
  .dialog label { font-size: 13px; opacity: 0.7; }
  .dialog input, .dialog select, .dialog textarea { background: var(--input-bg, rgba(0,0,0,0.25)); border: 1px solid var(--border, rgba(255,255,255,0.12)); border-radius: 8px; padding: 8px 12px; color: inherit; font-size: 14px; }
  .dialog textarea { min-height: 90px; font-family: monospace; }
  .dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .hint { font-size: 12px; opacity: 0.55; }
  .empty { padding: 30px; text-align: center; opacity: 0.5; font-size: 14px; }
</style>
</head>
<body>
  <div class="credits-shell">
    <div class="credits-header">
      <a class="back-link" href="/">← 返回对话面板</a>
      <h1>希尔娅 · 学分管理</h1>
      <span class="dev">开发者：2101497063@qq.com</span>
    </div>

    <div class="credits-stats">
      <div class="stat-chip"><b id="statClasses">–</b>班级</div>
      <div class="stat-chip"><b id="statStudents">–</b>学生</div>
      <div class="stat-chip"><b id="statRecords">–</b>学分记录</div>
      <div class="stat-chip"><b id="statPoints">–</b>总学分</div>
    </div>

    <div class="credits-grid">
      <!-- 左栏：班级 / 学分类型 -->
      <div>
        <div class="cpanel" style="margin-bottom:16px">
          <h2>班级 <span class="count" id="classCount"></span></h2>
          <div id="classList"></div>
          <button class="cbtn secondary" id="addClassBtn" style="width:100%;margin-top:10px">+ 新建班级</button>
        </div>
        <div class="cpanel">
          <h2>学分类型 <span class="count" id="typeCount"></span></h2>
          <div id="typeList"></div>
          <button class="cbtn secondary" id="addTypeBtn" style="width:100%;margin-top:10px">+ 添加类型</button>
        </div>
      </div>

      <!-- 右栏：学生 / 记录 -->
      <div>
        <div class="cpanel" style="margin-bottom:16px">
          <h2>学生名单</h2>
          <div class="toolbar">
            <input id="studentKeyword" placeholder="搜索学号 / 姓名…">
            <button class="cbtn secondary" id="importCsvBtn">CSV 导入</button>
            <button class="cbtn" id="addStudentBtn">+ 添加学生</button>
          </div>
          <div style="overflow-x:auto">
            <table class="ctable">
              <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>性别</th><th>电话</th><th>学分</th><th></th></tr></thead>
              <tbody id="studentBody"></tbody>
            </table>
          </div>
        </div>

        <div class="cpanel">
          <h2>学分记录</h2>
          <div class="toolbar">
            <input id="recordKeyword" placeholder="搜索学生 / 备注…">
            <select id="recordClassFilter"><option value="">全部班级</option></select>
            <select id="recordTypeFilter"><option value="">全部类型</option></select>
            <input id="recordSemester" placeholder="学期，如 2025-2026-1" style="min-width:150px">
            <button class="cbtn secondary" id="exportBtn" title="导出当前班级学分表（xlsx，需辅导员私密钥匙）">导出 xlsx</button>
            <button class="cbtn" id="addRecordBtn">+ 记学分</button>
          </div>
          <div style="overflow-x:auto">
            <table class="ctable">
              <thead><tr><th>学生</th><th>类型</th><th>分值</th><th>学期</th><th>日期</th><th>备注</th><th>操作者</th><th></th></tr></thead>
              <tbody id="recordBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="dialogRoot"></div>
<script src="/credits.js"></script>
</body>
</html>
